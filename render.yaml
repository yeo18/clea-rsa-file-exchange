services:
  - type: web
    name: clea
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clea-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: clea-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: clea-db
          property: password
      - key: CLEA_COOKIE_SECURE
        value: "true"
      - key: CLEA_MAIL_RESEND_API_KEY
        sync: false
      - key: CLEA_MAIL_FROM
        sync: false

databases:
  - name: clea-db
    databaseName: clea
    user: clea
    plan: free
