services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clea_dev
      POSTGRES_USER: clea_dev
      POSTGRES_PASSWORD: clea_dev_only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - clea-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clea_dev -d clea_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  clea-postgres-data:
